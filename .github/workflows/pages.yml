name: Verify GitHub Pages application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run sync:pages
      - name: Verify committed Pages snapshot matches source
        run: |
          git diff --exit-code -- index.html assets .nojekyll
          test -z "$(git ls-files --others --exclude-standard -- assets)"
